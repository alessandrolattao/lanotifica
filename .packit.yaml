---
# Packit configuration for LaNotifica
# https://packit.dev/docs/configuration/

downstream_package_name: lanotifica
upstream_tag_template: v{version}

specfile_path: packaging/rpm/lanotifica.spec

actions:
  # Build the Go binary before creating SRPM. The SRPM chroot is fedora-latest, whose
  # golang may be older than go.mod: GOTOOLCHAIN=auto fetches the required toolchain
  # from proxy.golang.org, verified against sum.golang.org (Fedora's GOSUMDB default)
  create-archive:
    - bash -c 'cd server && GOTOOLCHAIN=auto go build -ldflags "-s -w -X main.Version=$PACKIT_PROJECT_VERSION" -o ../bin/lanotifica ./cmd/lanotifica'
    - bash -c "tar --transform 's,^,lanotifica-${PACKIT_PROJECT_VERSION}/,' -czf lanotifica-${PACKIT_PROJECT_VERSION}.tar.gz bin/ packaging/ LICENSE"
    - bash -c "echo lanotifica-${PACKIT_PROJECT_VERSION}.tar.gz"

srpm_build_deps:
  - golang
  - make

jobs:
  # Build on COPR when a new release is tagged
  - job: copr_build
    trigger: release
    owner: alessandrolattao
    project: lanotifica
    # fedora-all follows the active Fedora releases (stable, branched, rawhide),
    # so a new Fedora gets builds without editing this list
    targets:
      - fedora-all
      - epel-10-x86_64
      - centos-stream-10-x86_64
    enable_net: true
